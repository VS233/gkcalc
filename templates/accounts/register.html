{% extends "base.html" %}
{% block title %}Регистрация — GKCalc{% endblock %}
{% block content %}
<div style="max-width:360px;margin:60px auto;padding:0 12px">
  <div class="gkc-card">
    <div class="gkc-card-title">Регистрация</div>
    <form method="post" class="gkc-form">
      {% csrf_token %}
      {% for field in form %}
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div style="color:#ef4444;font-size:0.75rem">{{ field.errors }}</div>{% endif %}
      {% endfor %}
      <button type="submit" class="btn-gkc" style="width:100%">Зарегистрироваться</button>
    </form>
    <div style="margin-top:10px;font-size:0.8rem;color:var(--text-muted);text-align:center">
      Уже есть аккаунт? <a href="{% url 'accounts:login' %}" style="color:var(--accent)">Войти</a>
    </div>
  </div>
</div>
{% endblock %}
